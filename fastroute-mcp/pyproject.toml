[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastroute-mcp"
version = "0.1.0"
description = "Agent-native MCP server for FastRoute PCB autorouting"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.scripts]
fastroute-mcp = "fastroute_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]